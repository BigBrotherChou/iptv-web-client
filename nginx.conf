server {
    listen 8088;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 传输压缩：文本类资源体积减 60-70%
    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 页面与业务代码（index/css/app）：每次校验，升级立即生效
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # 第三方解码库：内容永不变化，长期缓存（首次加载后不再重传）
    location /js/vendor/ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 组播流反代：转发给 udpxy（只转发字节流，不做任何解码）
    # 注意：udpxy 以 -a 192.168.100.1 启动，仅监听 LAN IP，故不能用 127.0.0.1
    location ~ ^/(udp|rtp)/ {
        proxy_pass http://192.168.100.1:4022;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Access-Control-Allow-Origin * always;
    }

    # 频道清单反代：读取 uhttpd 上的 /iptv.m3u，保持页面与清单同源
    location = /iptv.m3u {
        proxy_pass http://127.0.0.1:80/iptv.m3u;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache";
    }
}